<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#D94F8A"><title>إنشاء QR للبروفايل</title><link rel="stylesheet" href="css/design-tokens.css"><link rel="stylesheet" href="css/styles.css"><style>.qr-wrap{max-width:720px;margin:50px auto;padding:24px}.qr-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(22px,5vw,40px);box-shadow:var(--shadow)}.qr-card input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;direction:ltr;margin:8px 0 14px}.qr-result{display:flex;justify-content:center;margin:24px auto}.qr-note{background:var(--soft);padding:12px 16px;border-radius:12px;font-size:14px}</style></head><body><main class="qr-wrap"><section class="qr-card"><p class="eyebrow">Share Your Profile</p><h1>إنشاء رمز QR للبروفايل</h1><p>بعد نشر البروفايل على رابط عام، أدخل الرابط هنا لإنشاء صورة QR مستقلة.</p><label for="profileUrl">رابط البروفايل المنشور</label><input id="profileUrl" type="url" placeholder="https://username.github.io/repository/" required><div class="actions"><button class="button primary" id="generate">إنشاء QR</button><button class="button outline" id="download" disabled>تنزيل PNG</button></div><div class="qr-result" id="qrResult"></div><p id="status" role="status"></p><p class="qr-note">يحتاج إنشاء الرمز إلى اتصال بالإنترنت لتحميل مكتبة QR. لا تستخدم رابطًا محليًا من جهازك؛ يجب أن يكون الرابط متاحًا للآخرين.</p><a class="button outline" href="index.html">العودة للبروفايل</a></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const urlField=document.getElementById('profileUrl'),result=document.getElementById('qrResult'),statusEl=document.getElementById('status'),downloadBtn=document.getElementById('download');document.getElementById('generate').addEventListener('click',()=>{const url=urlField.value.trim();if(!/^https?:\/\//i.test(url)){statusEl.textContent='أدخل رابطًا عامًا يبدأ بـ https:// أو http://';return;}if(typeof QRCode==='undefined'){statusEl.textContent='تعذر تحميل مكتبة QR؛ تحقق من اتصال الإنترنت.';return;}result.replaceChildren();new QRCode(result,{text:url,width:280,height:280,colorDark:'#28232a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});downloadBtn.disabled=false;statusEl.textContent='تم إنشاء الرمز. اختبره بكاميرا الهاتف قبل الطباعة.';});downloadBtn.addEventListener('click',()=>{const canvas=result.querySelector('canvas'),img=result.querySelector('img');const src=canvas?canvas.toDataURL('image/png'):(img?img.src:'');if(!src)return;const a=document.createElement('a');a.href=src;a.download='doaa-profile-qr.png';a.click();});</script></body></html>
